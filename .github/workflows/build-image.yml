name: Build Image

on:
    workflow_call:
        inputs:
            image-name:
                description: Fully qualified image name, without a tag
                required: true
                type: string
            dockerfile:
                description: Dockerfile path, relative to the repo root
                required: true
                type: string
            cache-scope:
                description: GHA cache scope, also used to namespace digest artifacts
                required: true
                type: string
            build-args:
                description: Newline-separated KEY=VALUE build args
                required: false
                type: string
                default: ""
        outputs:
            digest:
                description: Digest of the pushed multi-arch manifest list
                value: ${{ jobs.merge.outputs.digest }}

jobs:
    build:
        strategy:
            matrix:
                include:
                    - platform: amd64
                      runner: ubuntu-24.04
                    - platform: arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{ inputs.dockerfile }}
                  platforms: linux/${{ matrix.platform }}
                  build-args: ${{ inputs.build-args }}
                  outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}-${{ matrix.platform }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ inputs.cache-scope }}-${{ matrix.platform }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            packages: write
        outputs:
            digest: ${{ steps.manifest.outputs.digest }}
        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/digests
                  pattern: digests-${{ inputs.cache-scope }}-*
                  merge-multiple: true

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Create manifest list and push
              id: manifest
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create \
                    -t ${{ inputs.image-name }}:latest \
                    -t ${{ inputs.image-name }}:${{ github.sha }} \
                    $(printf '${{ inputs.image-name }}@sha256:%s ' *)
                  digest="$(docker buildx imagetools inspect \
                    --format '{{ .Manifest.Digest }}' \
                    '${{ inputs.image-name }}:${{ github.sha }}')"
                  echo "digest=$digest" >>"$GITHUB_OUTPUT"

            - name: Inspect image
              run: docker buildx imagetools inspect ${{ inputs.image-name }}:latest
