name: Build VSG + Chrono Image

on:
    push:
        branches: [main]
        paths:
            - "docker/vsg-chrono.Dockerfile"
    workflow_dispatch:

env:
    IMAGE_NAME: ghcr.io/trickfirerobotics/simulations-vsg-chrono

jobs:
    build:
        strategy:
            matrix:
                include:
                    - platform: amd64
                      runner: ubuntu-24.04
                    - platform: arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/vsg-chrono.Dockerfile
                  platforms: linux/${{ matrix.platform }}
                  outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=vsg-chrono-${{ matrix.platform }}
                  cache-to: type=gha,mode=max,scope=vsg-chrono-${{ matrix.platform }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ matrix.platform }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            packages: write
        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create \
                    -t ${{ env.IMAGE_NAME }}:latest \
                    -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
                    $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect image
              run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest
