controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 60 # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - baseplate_left_right
      - shoulder_up_down
      - elbow_up_down
      - gripper_up_down
      - gripper_left_right
      - claw_open_close

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
