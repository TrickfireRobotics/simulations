# Tier 1: two offset blocks that load one diagonal pair of wheels.
#
# This is the cross-axle articulation case: the rover is forced into its worst twist,
# which is where a differential (or its absence) shows up most clearly and where a
# rocker travel limit is most likely to be hit.

extends: rigid-flat

name: rigid-diagonal-obstacle
version: 1
description: Tier 1 - offset blocks forcing maximum cross-axle articulation.

size_x: 20.0
size_y: 6.0

obstacles:
    - type: box
      position: [3.0, 0.3, 0.0]
      dimensions: [0.5, 0.5, 0.24]
      fixed: true
    - type: box
      position: [4.2, 0.9, 0.0]
      dimensions: [0.5, 0.5, 0.24]
      fixed: true
